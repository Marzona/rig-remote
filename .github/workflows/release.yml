# Release — runs when a version tag (e.g. v3.1) is pushed.
#
#   1. Re-runs the full CI pipeline (lint, tests, sdist/wheel/.deb build).
#   2. Checks that the tagged commit is on master and that the tag matches
#      the version in pyproject.toml.
#   3. Publishes to TestPyPI, then to PyPI, using Trusted Publishing (OIDC):
#      no API tokens are stored in the repository.
#   4. Creates a GitHub Release with the wheel, sdist and .deb attached.
#
# Development versions (PEP 440 X.Y.devN, tag vX.Y.devN) stop after step 3's
# TestPyPI upload: no production PyPI upload and no GitHub Release. Use a new
# N for every TestPyPI trial; the next real release is plain X.Y.
#
# Actions are pinned to commit SHAs (version in the trailing comment);
# Dependabot's github-actions ecosystem proposes updates.
#
# One-time setup (see README / PR description):
#   - Import .github/rulesets/release-tags.json (Settings → Rules → Rulesets →
#     New ruleset → Import) so only admins can create, move or delete v* tags.
#   - Create GitHub environments "testpypi" and "pypi" (Settings → Environments).
#     Add yourself as a required reviewer on "pypi": this approval is the
#     ONLY path to a production upload (release.sh and agents never upload).
#   - On test.pypi.org and pypi.org, add a Trusted Publisher for project
#     rig-remote: owner Marzona, repo rig-remote, workflow release.yml,
#     environment testpypi / pypi respectively.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  verify-version:
    name: Tag matches pyproject version
    runs-on: ubuntu-latest
    outputs:
      is-dev: ${{ steps.compare.outputs.is-dev }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Full history of all branches, so the on-master check can run.
          fetch-depth: 0
      - name: Tagged commit must be on master
        # Any v* tag triggers this workflow; refuse to publish a commit that
        # never reached master (e.g. a tag pushed on a feature branch).
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/master; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on master; refusing to release."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} points at a commit on master."
      - name: Compare tag with pyproject.toml
        id: compare
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "${tag}" != "${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}"
            exit 1
          fi
          if [[ "${version}" =~ \.dev[0-9]+$ ]]; then
            echo "is-dev=true" >> "${GITHUB_OUTPUT}"
            echo "Releasing development version ${version} (TestPyPI only)"
          else
            echo "is-dev=false" >> "${GITHUB_OUTPUT}"
            echo "Releasing version ${version}"
          fi

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [ci, verify-version]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/rig-remote/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          # Allows re-running a failed release without bumping the version.
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: [verify-version, publish-testpypi]
    if: needs.verify-version.outputs.is-dev == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rig-remote/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-dist
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deb
          path: dist/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "Release ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
