# CI — runs on every push to master and every pull request.
#
# Mirrors .claude/rules/verification.md and the commit_push stage of release.sh:
#   lint      : ruff check + ruff format --check + mypy (strict)
#   test      : unit tests (parallel, with coverage) + functional tests (serial)
#   package   : sdist + wheel + .deb (lintian-checked) via `release.sh package`
#   test-deb  : installs the .deb in a clean ubuntu:26.04 and starts it
#   adr-impact: PR/push gate on architecture-affecting changes
#
# Also exposed via workflow_call so release.yml reuses exactly the same gates.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.13"
  # PySide6 tests run without a display server.
  QT_QPA_PLATFORM: offscreen
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: ruff check
        run: uv run --no-sync ruff check --output-format=github ./src

      - name: ruff format
        run: uv run --no-sync ruff format --check ./src

      - name: mypy
        run: uv run --no-sync mypy --config-file ./pyproject.toml ./src

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0t64

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Unit tests
        run: >-
          uv run --no-sync pytest tests/ -n auto --tb=short
          -o faulthandler_timeout=120
          --cov=rig_remote --cov=config_checker
          --cov-report=term-missing --cov-report=xml

      # gqrx-marked tests need a live gqrx at 127.0.0.1:7356, which CI runners
      # never have; they are excluded explicitly rather than silently skipped.
      - name: Functional tests (excluding gqrx)
        run: uv run --no-sync pytest functional_tests/ -m "not gqrx" -n 1 --tb=short -o faulthandler_timeout=120

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Build packages
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Build the .deb on the oldest supported Ubuntu that ships python3 >= 3.13,
    # so the Depends: line computed by release.sh (via ldd + dpkg -S) names
    # packages that exist on the target distribution.
    container: ubuntu:26.04
    steps:
      - name: Install build tooling and Qt runtime libraries
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git binutils file fakeroot lintian dpkg-dev \
            libegl1 libgl1 libglx0 libglvnd0 libx11-xcb1 libx11-6 libxcomposite1 \
            libxdamage1 libxext6 libxfixes3 libxrandr2 libxrender1 libxtst6 \
            libasound2t64 libdbus-1-3 libdrm2 libfontconfig1 libfreetype6 libgbm1 \
            libglib2.0-0t64 libgssapi-krb5-2 libnspr4 libnss3 libpulse0 libsndfile1 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 libwayland-server0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 \
            libxkbcommon0 libxkbfile1 libpcsclite1 \
            libhamlib4t64

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Build sdist, wheel and .deb
        run: ./release.sh package

      - name: Check package metadata
        run: uv run --no-sync twine check --strict dist/*.whl dist/*.tar.gz

      # Installs the wheel into a clean venv and starts both entry points, so a
      # missing dependency, bad entry point or unloadable native library
      # (PySide6, Hamlib -> libhamlib4t64) fails CI instead of the user.
      - name: Smoke-test the wheel
        run: |
          uv venv --python "${PYTHON_VERSION}" /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          QT_QPA_PLATFORM=offscreen /tmp/smoke/bin/rig_remote --help
          /tmp/smoke/bin/config_checker --help

      - name: Upload Python distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

      # Internal candidate: release.yml consumes the "deb" artifact, which is
      # only published by test-deb after the package installed and started.
      - name: Upload Debian package candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb-candidate
          path: dist/*.deb
          if-no-files-found: error

  test-deb:
    name: Test .deb install
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Clean target distribution: only what the package's Depends: pulls in.
    container: ubuntu:26.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deb-candidate
          path: dist/

      - name: Install the .deb
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y ./dist/rig-remote_*.deb

      - name: Start the installed entry points
        run: |
          QT_QPA_PLATFORM=offscreen /usr/bin/rig_remote --help
          /usr/bin/config_checker --help

      # Reached only if install and start succeeded; release.yml downloads "deb".
      - name: Upload tested Debian package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

  adr-impact:
    name: ADR impact gate
    # Skipped when called from release.yml (workflow_call).
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      # Untrusted PR text is passed via env vars only, never interpolated into the script.
      - name: Check ADR impact
        env:
          ADR_GATE_EVENT: ${{ github.event_name }}
          ADR_GATE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          ADR_GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ADR_GATE_PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check_adr_impact.py
