kind = "seed"
title = "Any mid-scan update (delay, sgn_level, ...) restarts the remaining pass count"
origin = '''
Real behaviour until afb42b7: a delay or signal-level change during the last pass added passes.
'''
pr_description = '''
Simplify pass-count handling in the scan strategies: re-read task.passes whenever process_queue
applied an update, instead of going through the separate consume_passes_update() flag.
'''

[expect]
files = ["src/rig_remote/frequency_scanner_strategy.py", "src/rig_remote/bookmark_scanner_strategy.py"]
keywords = ["reset", "restart", "pass_count", "pass count", "consume_passes_update"]
min_severity = "MAJOR"

