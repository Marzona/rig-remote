kind = "seed"
title = "Pass count 0 clamped to 1, breaking infinite scans (code, tests and docs changed together)"
origin = '''
Real bug: shipped until afb42b7. The UI labels passes '0=Infinite' and the default config uses 0, but ScanningTask clamped 0 to 1; the tests and ADR-5 agreed with the wrong rule.
'''
pr_description = '''
Validate scan passes: a pass count must be at least 1. A value of 0 made the pass counter start at
zero, so _check_passes now clamps anything <= INFINITE_PASSES to 1. Tests and ADR-5 updated to match.
'''

[expect]
files = ["src/rig_remote/models/scanning_task.py"]
keywords = ["infinite"]
min_severity = "MAJOR"

[[edit]]
file = "src/rig_remote/models/scanning_task.py"
old = '''
    def _check_passes(self) -> None:
        """Clamp negative pass counts; 0 (INFINITE_PASSES) means scan until stopped.

        A negative value is a typo, not a request to scan forever, so it is
        clamped to the smallest finite count (1) rather than to 0.
        """
        if self.passes < INFINITE_PASSES:
            logger.error("scan passes must be >= 0 (0 = infinite), got %i, updated to 1", self.passes)
            self.passes = 1
'''
new = '''
    def _check_passes(self) -> None:
        """A scan needs at least one pass; clamp anything lower to 1."""
        if self.passes <= INFINITE_PASSES:
            logger.error("scan passes must be >= 1, got %i, updated to 1", self.passes)
            self.passes = 1
'''

